version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clientsync-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clientsync
    ports:
      - "5432:5432"
    volumes:
      - clientsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientsync"]
      interval: 5s
      timeout: 5s
      retries: 5

